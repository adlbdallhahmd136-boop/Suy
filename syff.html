<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>مركز سيبويه · دخول الطلاب</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- خط عربي سميك وجميل: Cairo -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
    }

    body {
      background: #f5f9ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    /* ----- LOADER ----- */
    .loader-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #0a1e2f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s;
    }
    .loader-hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 64px;
      height: 64px;
      border: 6px solid rgba(255,255,255,0.15);
      border-top: 6px solid #ffffff;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loader-text {
      margin-top: 24px;
      color: #d9e9ff;
      font-weight: 500;
      letter-spacing: 2px;
    }

    /* ----- LOGIN ----- */
    .login-view {
      max-width: 440px;
      width: 100%;
      background: white;
      border-radius: 36px;
      box-shadow: 0 30px 50px rgba(0, 20, 40, 0.08);
      padding: 40px 32px;
      transition: 0.2s;
    }
    .login-header {
      text-align: center;
      margin-bottom: 36px;
    }
    .login-header h2 {
      font-size: 28px;
      font-weight: 700;
      color: #0b2b4a;
    }
    .login-header p {
      color: #5f6c80;
      margin-top: 6px;
    }
    .input-group {
      margin-bottom: 22px;
    }
    .input-group label {
      display: block;
      font-weight: 500;
      font-size: 0.9rem;
      color: #1e293b;
      margin-bottom: 6px;
    }
    .input-group input {
      width: 100%;
      padding: 14px 18px;
      border: 1.5px solid #e0e7ef;
      border-radius: 24px;
      font-size: 1rem;
      background: #fafcff;
      transition: 0.15s;
    }
    .input-group input:focus {
      outline: none;
      border-color: #1e5aa8;
      box-shadow: 0 0 0 4px rgba(30,90,168,0.08);
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: #0b2b4a;
      color: white;
      border: none;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .login-btn:hover {
      background: #1a4a75;
    }
    .error-msg {
      color: #d32f2f;
      text-align: center;
      margin-top: 14px;
      font-size: 0.9rem;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- LOADER SCREEN -->
<div class="loader-screen" id="loaderScreen">
  <div class="spinner"></div>
  <div class="loader-text">مركز سيبويه</div>
</div>

<!-- LOGIN VIEW -->
<div id="loginView" class="login-view hidden">
  <div class="login-header">
    <h2>مرحباً بك</h2>
    <p>مركز سيبويه · بوابة الطلاب</p>
  </div>
  <form id="loginForm">
    <div class="input-group">
      <label>اسم المستخدم</label>
      <input type="text" id="loginUsername" autocomplete="off" required>
    </div>
    <div class="input-group">
      <label>كلمة المرور</label>
      <input type="password" id="loginPassword" required>
    </div>
    <button type="submit" class="login-btn">تسجيل الدخول</button>
    <div id="loginError" class="error-msg"></div>
  </form>
</div>

    const loader = document.getElementById('loaderScreen');
    const loginView = document.getElementById('loginView');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');

    // شاشة التحميل الابتدائية
    window.addEventListener('load', () => {
      setTimeout(() => {
        loader.classList.add('loader-hidden');
        setTimeout(() => {
          loader.style.display = 'none';
          loginView.classList.remove('hidden');
        }, 400);
      }, 2500);
    });

    // معالجة تسجيل الدخول للطلاب
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      // التحقق من صحة اسم المستخدم وكلمة المرور المشفرة داخل الكود لكل طالب

        loginError.textContent = '';
        window.location.href = STUDENT_DATA[username].page;
      } else {
        loginError.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
      }
    });

</script>
</body>
</html>
